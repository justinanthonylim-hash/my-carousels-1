```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Carousel</title>

  <!-- Swiper CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
    }

    body {
      overflow: hidden;
    }

    /* Carousel container */
    .swiper {
      width: 100%;
      padding: 10px 0 35px;
      overflow: hidden;
    }

    /* Each slide */
    .swiper-slide {
      width: 80%;
      aspect-ratio: 16 / 10;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Images */
    .swiper-slide img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Pagination */
    .swiper-pagination {
      bottom: 5px !important;
    }

    .swiper-pagination-bullet {
      width: 7px;
      height: 7px;
      background: #999;
      opacity: 0.5;
    }

    .swiper-pagination-bullet-active {
      background: #333;
      opacity: 1;
    }

    /* Mobile */
    @media (max-width: 600px) {

      .swiper {
        padding: 5px 0 30px;
      }

      .swiper-slide {
        width: 88%;
        aspect-ratio: 4 / 3;
        border-radius: 10px;
      }

      .swiper-pagination {
        bottom: 3px !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CAROUSEL
  ========================== -->

  <div class="swiper">

    <div class="swiper-wrapper">

      <!-- Photo 1 -->
      <div class="swiper-slide">
        <img src="foto web pai cia.png" alt="Photo 1">
      </div>

      <!-- Photo 2 -->
      <div class="swiper-slide">
        <img src="foto web pai cia (1).png" alt="Photo 2">
      </div>

      <!-- Photo 3 -->
      <div class="swiper-slide">
        <img src="foto web pai cia (2).png" alt="Photo 3">
      </div>

      <!-- Photo 4 -->
      <div class="swiper-slide">
        <img src="foto web pai cia (3).png" alt="Photo 4">
      </div>

      <!-- Photo 5 -->
      <div class="swiper-slide">
        <img src="foto web pai cia (4).png" alt="Photo 5">
      </div>

      <!-- Photo 6 -->
      <div class="swiper-slide">
        <img src="foto web pai cia (5).png" alt="Photo 6">
      </div>

      <!-- Photo 7 -->
      <div class="swiper-slide">
        <img src="foto web pai cia (6).png" alt="Photo 7">
      </div>

    </div>

    <!-- Dots only -->
    <div class="swiper-pagination"></div>

  </div>


  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>

    const swiper = new Swiper('.swiper', {

      /* Show part of the next/previous image */
      slidesPerView: 'auto',

      /* Space between images */
      spaceBetween: 15,

      /* Center the active image */
      centeredSlides: true,

      /* Infinite carousel */
      loop: true,

      /* Allow mouse dragging */
      grabCursor: true,

      /* Smooth movement */
      speed: 500,

      /* Dots */
      pagination: {
        el: '.swiper-pagination',
        clickable: true
      },

      /* Autoplay */
      autoplay: {
        delay: 3500,
        disableOnInteraction: false
      }

    });

  </script>

</body>
</html>
